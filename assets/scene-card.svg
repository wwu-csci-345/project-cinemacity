<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 40" width="56" height="40">
  <!-- Scene card / clapperboard -->
  <rect x="2" y="10" width="52" height="28" rx="3" fill="#16213e" stroke="#f5a623" stroke-width="2"/>
  <!-- Clapperboard top bar -->
  <rect x="2" y="2" width="52" height="12" rx="3" fill="#f5a623"/>
  <!-- Clapperboard stripes -->
  <line x1="12" y1="2" x2="8" y2="14" stroke="#16213e" stroke-width="3"/>
  <line x1="22" y1="2" x2="18" y2="14" stroke="#16213e" stroke-width="3"/>
  <line x1="32" y1="2" x2="28" y2="14" stroke="#16213e" stroke-width="3"/>
  <line x1="42" y1="2" x2="38" y2="14" stroke="#16213e" stroke-width="3"/>
  <!-- Lines suggesting scene card text -->
  <line x1="8" y1="22" x2="48" y2="22" stroke="#e0e0e0" stroke-width="1.5" opacity="0.5"/>
  <line x1="8" y1="28" x2="36" y2="28" stroke="#e0e0e0" stroke-width="1.5" opacity="0.3"/>
</svg>
